name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.5.1"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Poetry ставится до setup-python, иначе кеш `cache: poetry` не найдёт исполняемый файл.
      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Check pyproject.toml and poetry.lock
        run: poetry check --lock

      - name: Install dependencies into .venv
        run: poetry install --no-interaction

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks (ruff, mypy, poetry, hygiene)
        run: poetry run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Install dependencies into .venv
        run: |
          poetry env use "${{ matrix.python-version }}"
          poetry install --no-interaction

      - name: Run tests with coverage
        run: poetry run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t diamonds-mlops:ci .

      - name: Smoke test container
        run: |
          docker run -d --name diamonds-api -p 8000:8000 diamonds-mlops:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          curl -fsS -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"carat":0.5,"cut":"Ideal","color":"E","clarity":"SI1","depth":61.5,"table":55,"x":5.1,"y":5.0,"z":3.1}'
          docker logs diamonds-api
          docker rm -f diamonds-api
